<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">

		<style>
			.demo-dialogs {
				display: grid;
				width: 40em;
				grid-template-columns: 1fr 1fr;
			}
      .terminal {
        margin-left: 2em;
        margin-right: 2em;
        margin-top: 2em;

        display: grid;
        width: 40em;
        height: 25em;

        grid-template-columns: 1fr;
        grid-template-rows: 1fr 3rem;

      }
      .terminal > .content > .dialog {
        max-width: 20em;
      }

      .controls {
        top: 0px;
        position: fixed;
        background-color: var(--bg);
        padding: var(--padding);
        border-bottom: 2px solid var(--fg);
        z-index: 1;
      }

		</style>

		<script src="assets/elm.js"></script>
  </head>
  <body>
		<div id="main"></div>
		<script>
			var app = Elm.Main.init({ node: document.getElementById("main") });
		</script>
  </body>
</html>
